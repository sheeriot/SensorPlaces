<!-- Devices at this Location -->
<div class="card mt-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
            <i class="bi bi-hdd-rack me-2"></i>Devices
        </h5>
    </div>
    <div class="card-body p-0">
        {% if object.devices.exists %}
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for device in object.devices.all %}
                    <tr>
                        <td>
                            <a href="{% url 'sensors:device_detail' place_slug=place.slug pk=device.pk %}"
                                class="btn btn-outline-success text-dark m-0 p-1 small d-flex align-items-center">
                                <i class="bi bi-eye me-1"></i>
                                <span class="d-inline-block text-truncate" style="max-width: 100px;">{{ device.name }}</span>
                            </a>
                        </td>
                        <td>
                            <div class="form-check form-switch">
                                <input class="form-check-input device-status-toggle" 
                                        type="checkbox" 
                                        id="deviceStatus_{{ device.pk }}"
                                        data-device-id="{{ device.pk }}"
                                        data-location-id="{{ device.location.pk }}"
                                        {% if device.is_active %}checked{% endif %}
                                        {% if not device.location.is_active %}disabled{% endif %}>
                                <label class="form-check-label status-label {% if device.is_active %}text-success{% else %}text-danger{% endif %}" 
                                        for="deviceStatus_{{ device.pk }}">
                                    {% if device.is_active %}Active{% else %}inactive{% endif %}
                                </label>
                            </div>
                        </td>
                        <td>{{ device.device_type }}</td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a href="{% url 'sensors:device_update' place_slug=place.slug pk=device.pk %}" 
                                    class="btn btn-warning">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a href="{% url 'sensors:device_delete' place_slug=place.slug pk=device.pk %}" 
                                    class="btn btn-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="text-center py-4">
            <p class="mb-0">No devices at this location.</p>
        </div>
        {% endif %}
    </div>
</div>
