{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Check for pending location update message
    const locationUpdateMessage = {{ request.session.location_update_message|default:'null'|safe }};
    if (locationUpdateMessage) {
        const lines = locationUpdateMessage.message.split('\n');
        const message = lines.map((line, index) => 
            line.startsWith('•') ? 
                `<span class="d-block font-monospace ms-2">${line.trim()}</span>` : 
                line
        ).join('<br>');
        
        toastSystem.show({
            message: message,
            type: locationUpdateMessage.type,
            addToHistory: true,
            duration: 5000  // Show for 5 seconds on the destination page
        });
    }
});
</script>
{% endblock %}
