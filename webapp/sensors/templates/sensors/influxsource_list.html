{% extends "sensors/base.html" %}

{% block content %}
<div class="container">
    <h1>InfluxDB Sources</h1>
    <a href="{% url 'sensors:influxsource_create' %}" class="btn btn-primary mb-3">Add New Source</a>
    <ul class="list-group">
        {% for source in influxsource_list %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <a href="{% url 'sensors:influxsource_detail' source.pk %}">{{ source.name }}</a>
                <div>
                    <a href="{% url 'sensors:influxsource_update' source.pk %}" class="btn btn-sm btn-secondary">Edit</a>
                    <a href="{% url 'sensors:influxsource_delete' source.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item">No InfluxDB sources found.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
