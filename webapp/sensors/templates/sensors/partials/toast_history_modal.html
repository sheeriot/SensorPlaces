<!-- Toast History Modal -->
<div class="modal fade" id="toast-history-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-bell me-2"></i>Notification History
                </h5>
                <div class="d-flex gap-3 align-items-center ms-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="showAllToasts">
                        <label class="form-check-label" for="showAllToasts">
                            Show all notifications
                        </label>
                    </div>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="markAllRead">
                        <i class="bi bi-check-all me-1"></i>Mark all as read
                    </button>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div class="toast-history-list" id="toastHistoryList">
                    <!-- History will be loaded here via AJAX -->
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-hourglass-split fs-1 d-block mb-3"></i>
                        Loading notifications...
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Mark All Read Confirmation Modal -->
<div class="modal fade" id="mark-all-read-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to mark all notifications as read?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmMarkAllRead">
                    <i class="bi bi-check-all me-1"></i>Mark All as Read
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Template for JavaScript to use when rendering history items -->
<template id="toast-history-item-template">
    <div class="toast-history-item border-bottom" data-toast-id="">
        <div class="d-flex align-items-center justify-content-between p-2">
            <div class="toast-timestamp text-secondary font-monospace"></div>
            <div class="toast-type-badge text-center"></div>
            <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" id="toast-${toast.id}-read">
                <label class="form-check-label" for="toast-${toast.id}-read">Read</label>
            </div>
        </div>
        <div class="ms-4 mb-2"></div>
    </div>
</template>
