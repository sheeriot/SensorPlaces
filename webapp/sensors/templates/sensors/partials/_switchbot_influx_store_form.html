{% load crispy_forms_tags %}
<div class="modal-content">
    <form hx-post="{% url 'sensors:switchbot_influx_store_update' place_slug=place.slug %}"
          hx-target="#switchbot-influx-card" hx-swap="innerHTML">
        {% csrf_token %}
        <div class="modal-header">
            <h5 class="modal-title">Edit SwitchBot InfluxDB Store</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <p>Select the InfluxDB store to be used for all SwitchBot devices in this place.</p>
            <div class="mb-3">
                {{ form.switchbot_influx_store.label_tag }}
                {{ form.switchbot_influx_store }}
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Save</button>
        </div>
    </form>
</div>
