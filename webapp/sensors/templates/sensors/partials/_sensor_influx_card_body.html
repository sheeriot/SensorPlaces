<div class="row mb-3">
    <div class="col-md-6">
        <div class="text-muted small text-nowrap">
            <i class="bi bi-hdd-stack me-1"></i>InfluxDB Store
        </div>
        <div class="font-monospace text-primary">{{ sensor.influx_store.name|default:"N/A" }}</div>
    </div>
    <div class="col-md-6">
        <div class="text-muted small text-nowrap">
            <i class="bi bi-tag me-1"></i>Tag Key
        </div>
        <div class="font-monospace text-primary">{{ sensor.influx_tag_key|default:"N/A" }}</div>
    </div>
</div>
<div class="row">
    <div class="col-md-6">
        <div class="text-muted small text-nowrap">
            <i class="bi bi-rulers me-1"></i>Measurement
        </div>
        <div class="font-monospace text-primary">{{ sensor.influx_measurement|default:"N/A" }}</div>
    </div>
    <div class="col-md-6">
        <div class="text-muted small text-nowrap">
            <i class="bi bi-input-cursor-text me-1"></i>Field Name
        </div>
        <div class="font-monospace text-primary">{{ sensor.influx_field_name|default:"N/A" }}</div>
    </div>
</div>

<div id="influx-test-results-{{ sensor.pk }}" class="mt-3">
    <!-- Test results will be loaded here -->
</div>
