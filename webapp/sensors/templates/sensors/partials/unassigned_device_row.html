<!-- webapp/sensors/templates/sensors/partials/unassigned_device_row.html -->
<div class="list-group-item device-row py-2"
    data-device-active="{{ device.is_active|lower }}"
    data-device-id="{{ device.pk }}"
    data-location-active="true"
    data-location-id="unassigned">
    <div class="row g-0 align-items-center">
        <!-- Name -->
        <div class="col-6">
            <div class="d-flex align-items-start">
                <i class="bi bi-hdd-rack me-2 fs-5"></i>
                <div>
                    <a href="{% url 'sensors:device_detail' place_slug=device.location.place.slug pk=device.pk %}" class="text-decoration-none fw-bold">
                        {{ device.name }}
                    </a>
                </div>
            </div>
        </div>
        <!-- Model -->
        <div class="col-3">
            <small class="text-muted">
                {{ device.model|default:"-" }}
                {% if device.manufacturer %}
                    <br>{{ device.manufacturer }}
                {% endif %}
            </small>
        </div>
        <!-- Actions -->
        <div class="col-3 text-end">
            <div class="btn-group btn-group-sm">
                {% include 'sensors/partials/move_device_button.html' with device=device %}
                <a href="{% url 'sensors:device_update' place_slug=device.location.place.slug pk=device.pk %}?next={{ absolute_url|urlencode }}" class="btn btn-sm border-dark btn-outline-warning">
                    <i class="bi bi-pencil-fill"></i>
                </a>
                <button type="button" class="btn btn-sm btn-outline-danger delete-device"
                        hx-get="{% url 'sensors:device_delete' place_slug=device.location.place.slug pk=device.pk %}"
                        hx-target="#htmx-modal-content"
                        data-bs-toggle="modal"
                        data-bs-target="#htmx-modal"
                        title="Delete">
                    <i class="bi bi-trash-fill"></i>
                </button>
            </div>
        </div>
    </div>
</div>
