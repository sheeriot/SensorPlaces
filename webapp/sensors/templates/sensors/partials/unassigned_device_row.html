<tr class="device-row" draggable="true" data-device-id="{{ device.pk }}">
    <td>
        <a href="{{ device.get_absolute_url }}" class="d-flex align-items-center text-decoration-none fw-bold">
            <i class="bi bi-hdd-rack me-2"></i>
            <span>{{ device.name }}</span>
        </a>
    </td>
    <td>
        {% if device.is_active %}
            <span class="badge bg-success">Active</span>
        {% else %}
            <span class="badge bg-secondary">Inactive</span>
        {% endif %}
    </td>
    <td>{{ device.device_type.name|default:"-" }}</td>
    <td>{{ device.model|default:"-" }}</td>
    <td>{{ device.manufacturer|default:"-" }}</td>
    <td>{{ device.device_id|default:"-" }}</td>
    <td class="text-end">
        <a href="{% url 'sensors:device_update' place_slug=place.slug pk=device.pk %}" class="btn btn-sm btn-outline-warning" title="Edit">
            <i class="bi bi-pencil-fill"></i>
        </a>
    </td>
</tr>
