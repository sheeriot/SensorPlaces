<!-- Toast Message Container -->
<div id="toast-messages" class="d-none">
    {% if toast_message %}
        <div class="server-toast-message" data-processed="false">
            <script type="application/json">
                {
                    "message": "{{ toast_message.message|safe }}",
                    "type": "{{ toast_message.type }}"
                }
            </script>
        </div>
    {% endif %}

    {% if toast_messages %}
        {% for message in toast_messages %}
            <div class="server-toast-message" data-processed="false">
                <script type="application/json">
                    {
                        "message": "{{ message.message|safe }}",
                        "type": "{{ message.type }}"
                    }
                </script>
            </div>
        {% endfor %}
    {% endif %}
</div>
