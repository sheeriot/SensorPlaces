{% load widget_tweaks %}
{% load humanize %}

<tr id="sensor-row-{{ sensor.pk }}"
    class="{% if not sensor.is_active or not sensor.device.is_active %}opacity-50 sensor-inactive{% endif %} {% if model_name == 'sensor' and sensor.pk == object.pk %}bg-warning-subtle{% endif %}"
    data-sensor-id="{{ sensor.pk }}"
    data-sensor-name="{{ sensor.name }}"
    data-sensor-active="{{ sensor.is_active|lower }}"
    data-device-id="{{ sensor.device.pk }}"
    data-is-switchbot="{{ sensor.device.is_switchbot|yesno:'true,false' }}"
    data-poll-url="{% url 'sensors:sensor_live_value' place_slug=place.slug pk=sensor.pk %}"
    data-poll-style="row_content"
    data-narrow-view="{{ narrow_view|lower }}"
    {% if not sensor.is_active and hide_inactive %}style="display: none !important;"{% endif %}>
    {% include "sensors/partials/_sensor_row_content.html" %}
</tr>
