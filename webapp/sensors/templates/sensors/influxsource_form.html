{% extends "sensors/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <h1>{% if object %}Edit{% else %}Add{% endif %} InfluxDB Source</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'sensors:influxsource_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
