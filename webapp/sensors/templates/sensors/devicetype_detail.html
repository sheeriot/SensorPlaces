{% extends 'sensors/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="bi {{ object.icon }}"></i>
            Device Type: {{ object.name }}
        </h2>
        <a href="{% url 'sensors:devicetype_update' pk=object.pk %}" class="btn btn-primary">
            <i class="bi bi-pencil"></i> Edit
        </a>
    </div>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Details</h5>
            <p><strong>Description:</strong> {{ object.description|default:"N/A" }}</p>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Status:</strong>
                        {% if object.is_active %}
                            <span class="badge bg-success">Active</span>
                        {% else %}
                            <span class="badge bg-danger">Inactive</span>
                        {% endif %}
                    </p>
                    <p><strong>Icon Class:</strong> <code>{{ object.icon }}</code></p>
                </div>
            </div>
        </div>
    </div>
    <a href="{% url 'sensors:devicetype_list' %}" class="btn btn-secondary mt-3">Back to List</a>
</div>
{% endblock %}
