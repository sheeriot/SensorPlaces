{% extends "sensors/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Add LoRaWAN Sensor{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    Add LoRaWAN Sensor to {{ device.name }}
                </h5>
                <div class="text-muted small">
                    <i class="bi bi-geo-alt"></i> {{ device.location.name }} / {{ place.name }}
                </div>
            </div>
            <div class="card-body">
                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
