{% extends "sensors/base.html" %}
{% block title %}{{ sensor.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12 mb-4">
        <div class="d-flex align-items-center gap-3">
            <div>
                <h1 class="mb-0">Sensor: {{ sensor.name }}</h1>
            </div>
            <div class="btn-group ms-auto">
                <a href="{% url 'sensors:sensor_update' place_slug=sensor.device.location.place.slug pk=sensor.pk %}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> Edit
                </a>
                <a href="{% url 'sensors:sensor_delete' place_slug=sensor.device.location.place.slug pk=sensor.pk %}" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Delete
                </a>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        {% include "sensors/includes/sensor_detail_card.html" with sensor=sensor %}
    </div>

    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Recent Readings</h5>
            </div>
            <div class="card-body">
                <div class="readings-chart-container" 
                     data-sensor-id="{{ sensor.pk }}"
                     data-unit="{{ sensor.get_unit_display }}"
                     data-name="{{ sensor.name }}">
                    <canvas id="readingsChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
