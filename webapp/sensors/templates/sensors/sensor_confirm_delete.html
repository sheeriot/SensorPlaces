{% extends "sensors/base.html" %}

{% block title %}Delete Sensor{% endblock %}

{% block content %}
<div class="container">
    <h1>Delete Sensor</h1>
    <p>Are you sure you want to delete the sensor "{{ sensor.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'sensors:device_detail' place_slug=sensor.device.location.place.slug location_pk=sensor.device.location.pk pk=sensor.device.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
