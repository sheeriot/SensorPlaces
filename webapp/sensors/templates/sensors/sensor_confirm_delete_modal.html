<form hx-post="{{ object.get_absolute_url }}delete/" hx-target="#sensor-row-{{ object.pk }}" hx-swap="outerHTML">
    <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Delete Sensor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <p>Are you sure you want to delete the sensor <strong>"{{ object.name }}"</strong>?</p>
        <p class="text-muted">This action cannot be undone. All associated readings will also be permanently deleted.</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">Delete Sensor</button>
    </div>
</form>
