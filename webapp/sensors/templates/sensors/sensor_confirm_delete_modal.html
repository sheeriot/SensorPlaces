<form id="deleteSensorForm" method="post" action="{% url 'sensors:sensor_delete' place_slug=place.slug pk=object.pk %}">
    <div class="modal-header">
        <h5 class="modal-title" id="deleteSensorModalLabel">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <p>Are you sure you want to delete the sensor <strong><i class="bi bi-thermometer"></i> {{ object.name }}</strong>?</p>
        <p class="text-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            This action cannot be undone. All readings from this sensor will also be deleted.
        </p>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.META.HTTP_REFERER }}">
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">Delete</button>
    </div>
</form>
