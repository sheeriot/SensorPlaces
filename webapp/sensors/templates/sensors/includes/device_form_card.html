{% load crispy_forms_tags %}
<div class="card my-1" id="device-form-card">
    <div class="card-header d-flex justify-content-between align-items-center py-2">
        <h5 class="card-title mb-0 fs-5">
            {% if object %}
                Edit Device:
                <a href="{{ object.get_absolute_url }}" class="text-body text-decoration-none">
                    <i class="bi bi-hdd-rack"></i>
                    {{ object.name }}
                </a>
            {% else %}
                <i class="bi bi-hdd-rack me-2"></i> New Device
            {% endif %}
        </h5>
        <div class="d-flex align-items-center">
            <i class="bi bi-geo-alt me-1"></i>
            <span>{{ location.name|default:"No Location" }}</span>
            <i class="bi bi-chevron-right mx-2"></i>
            <i class="bi bi-house-gear me-1"></i>
            <span>{{ place.name }}</span>
        </div>
    </div>
    <div class="card-body p-2" id="device-form-card-body">
        {% crispy form %}
    </div>
</div>
