{% load crispy_forms_tags %}
<div class="card rounded-3 shadow-sm border-0" id="device-form-card">
    <div class="card-header bg-white py-2">
        <h5 class="card-title mb-0">
            <i class="bi bi-hdd-rack"></i>
            {% if object %}
                Edit Device: 
                <a href="{% url 'sensors:device_detail' place_slug=place.slug pk=device.pk %}">
                    {{ device.name }}
                </a>
            {% else %}
                New Device
            {% endif %}
            <small class="text-body-secondary ms-2">
                <i class="bi bi-chevron-right"></i>
                <a href="{% url 'sensors:location_detail' place_slug=place.slug slug=location.slug %}" class="link-dark">
                    <i class="bi bi-geo-alt"></i>
                    {{ location.name }}
                </a> 
                <i class="bi bi-chevron-right"></i>
                <a href="{% url 'sensors:place_detail' place.slug %}">
                    <i class="bi bi-house-gear"></i>
                    {{ place.name }}
                </a> 
            </small>
        </h5>
    </div>
    <div class="card-body device-form-card" id="device-form-card">
        {% crispy form %}
    </div>
</div>
