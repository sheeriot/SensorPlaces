{% load widget_tweaks %}

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<div class="card rounded-3 shadow-sm border-0 mb-1">
    <div class="card-header bg-white py-2">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">
                <i class="bi bi-house-gear me-2"></i>Place:
                <a href="{% url 'sensors:place_detail' place.slug %}" class="text-secondary fw-normal">{{ place.name }}</a>
                {% if place.is_active %}
                <span class="badge bg-success ms-2">Active</span>
                {% else %}
                <span class="badge bg-danger ms-2">inactive</span>
                {% endif %}
            </h5>
            <div class="d-flex align-items-center gap-3 small">
                <span>
                    <i class="bi bi-mailbox me-1"></i>{{ place.address }}
                </span>
                <span>
                    <i class="bi bi-geo-alt me-1"></i>{{ place.latitude }}, {{ place.longitude }}
                </span>
                <a href="#" class="btn btn-outline-primary rounded-circle p-1" id="openMap">
                    <i class="bi bi-globe"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Map -->
<div id="mapModal" class="modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ place.name }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div id="leafletMap" style="height: 500px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const openMapButton = document.getElementById('openMap');
    const mapModal = document.getElementById('mapModal');
    let map = null;

    openMapButton.addEventListener('click', function(e) {
        e.preventDefault();
        const modal = new bootstrap.Modal(mapModal);
        modal.show();
    });

    mapModal.addEventListener('shown.bs.modal', function () {
        if (!map) {
            setTimeout(function() {
                map = L.map('leafletMap');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                const lat = {{ place.latitude }};
                const lng = {{ place.longitude }};
                map.setView([lat, lng], 15);
                
                L.marker([lat, lng])
                    .addTo(map)
                    .bindPopup("{{ place.name }}")
                    .openPopup();

                map.invalidateSize();
            }, 100);
        } else {
            map.invalidateSize();
        }
    });
});
</script>
