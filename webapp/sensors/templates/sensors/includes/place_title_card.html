{% load widget_tweaks %}

<div class="card rounded-3 shadow-sm border-0 mb-3">
    <div class="card-header bg-white py-2">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">
                <i class="bi bi-building me-2"></i>{{ place.name }}
            </h5>
            <div class="d-flex align-items-center gap-3 small">
                <span>
                    <i class="bi bi-geo-alt me-1"></i>{{ place.address }}
                </span>
                <span>
                    <i class="bi bi-geo me-1"></i>{{ place.latitude }}, {{ place.longitude }}
                </span>
                <a href="https://www.google.com/maps?q={{ place.latitude }},{{ place.longitude }}" 
                   onclick="window.open(this.href, 'googleMaps', 'width=800,height=600'); return false;" 
                   class="btn btn-outline-primary btn-sm p-1" 
                   title="Open in Google Maps">
                    <i class="bi bi-globe"></i>
                </a>
            </div>
        </div>
    </div>
    {% if show_map %}
    <div class="card-body py-2">

        <div class="row mt-2">
            <div class="col-12">
                <div class="border rounded">
                    {{ map_html|safe }}
                </div>
            </div>
        </div>
    </div>
    {% endif %}
</div>
