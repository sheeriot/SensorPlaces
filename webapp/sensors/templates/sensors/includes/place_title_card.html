{% load widget_tweaks %}

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<div class="card rounded-3 shadow-sm border-0 mb-1">
    <div class="card-header bg-white py-2">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">
                <i class="bi bi-house-gear me-2"></i>Place:
                <a href="{% url 'sensors:place_detail' place_slug=place.slug %}" class="text-secondary fw-normal">{{ place.name }}</a>
                {% if place.is_active %}
                <span class="badge bg-success ms-2">Active</span>
                {% else %}
                <span class="badge bg-danger ms-2">inactive</span>
                {% endif %}
            </h5>
            <div class="d-flex align-items-center gap-3 small">
                <span>
                    <i class="bi bi-mailbox me-1"></i>{{ place.address }}
                </span>
                <span>
                    <i class="bi bi-geo-alt me-1"></i>{{ place.latitude }}, {{ place.longitude }}
                </span>
                <a href="#" class="btn btn-outline-primary rounded-circle p-1" id="openMap">
                    <i class="bi bi-globe"></i>
                </a>
            </div>
        </div>
    </div>
</div>
