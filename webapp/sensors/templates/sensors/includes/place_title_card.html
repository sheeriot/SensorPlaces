{% load widget_tweaks %}
{% load sensor_filters %}

<div class="card rounded-3 shadow-sm border-0 mb-1">
    <div class="card-header bg-white py-2">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">
                <i class="bi bi-house-gear me-2"></i>Place:
                <a href="{% url 'sensors:place_detail' place_slug=place.slug %}" class="text-secondary fw-normal">{{ place.name }}</a>
                {% if place.is_active %}
                <span class="badge bg-success ms-2">Active</span>
                {% else %}
                <span class="badge bg-danger ms-2">inactive</span>
                {% endif %}
            </h5>
            <div class="d-flex align-items-center gap-3 small">
                <span>
                    <i class="bi bi-mailbox me-1"></i>{{ place.address }}
                </span>
                <span>
                    <i class="bi bi-geo-alt me-1"></i>{{ place.latitude }}, {{ place.longitude }}
                </span>
                <a href="#" class="btn btn-outline-primary rounded-circle p-1" id="openPlaceMap" 
                   data-place-map-popout="true"
                   data-bs-toggle="modal" 
                   data-bs-target="#placeMapModal" 
                   data-place-lat="{{ place.latitude }}"
                   data-place-lon="{{ place.longitude }}"
                   data-place-name="{{ place.name }}"
                   data-place-slug="{{ place.slug }}">
                    <i class="bi bi-globe"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Place Map Modal -->
<div class="modal fade" id="placeMapModal" data-map-type="popout">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-globe me-2"></i>{{ place.name }} Map
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div id="placeMapContainer" class="place-map-container" 
                     data-place-lat="{{ place.latitude }}"
                     data-place-lon="{{ place.longitude }}"
                     data-place-name="{{ place.name }}"
                     data-place-slug="{{ place.slug }}"></div>
            </div>
        </div>
    </div>
</div>
