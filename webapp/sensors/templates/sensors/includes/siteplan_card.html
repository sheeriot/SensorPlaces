{% load static %}

<!-- Siteplan Card -->
<div id="siteplan-card"
     class="card {% if not place.is_active %}opacity-50 text-muted{% endif %}">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
            <i class="bi bi-map me-2"></i>
            Site Plan
        </h5>
        {% if editable %}
        <button id="siteplan-edit" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-grid"></i> Edit Layout
        </button>
        {% else %}
        <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#siteplan-view-modal">
            <i class="bi bi-arrows-fullscreen"></i> Expand
        </button>
        {% endif %}
    </div>
    {% if place.siteplan_image %}
    <div class="card-body p-0">
        <div class="siteplan-wrapper bg-light border-top">
            <div id="siteplan-container"
                 data-place-slug="{{ place.slug }}"
                 data-image-url="{{ place.get_siteplan_url }}"
                 data-locations="{{ locations_json|escapejs }}">
            </div>
        </div>
    </div>
    {% else %}
    <div class="card-body text-center text-muted">
        <p class="mb-0">No site plan image available</p>
    </div>
    {% endif %}
</div>

<!-- Siteplan View Modal -->
<div class="modal fade" id="siteplan-view-modal" tabindex="-1" aria-labelledby="siteplan-view-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="siteplan-view-modal-label">{{ place.name }} Site Plan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <!-- The map container will be moved here by JavaScript -->
            </div>
        </div>
    </div>
</div>
<!-- Siteplan Editor Modal -->
<div class="modal fade" id="siteplan-editor" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            {% include "sensors/includes/siteplan_editor.html" %}
        </div>
    </div>
</div>
