<!-- Siteplan Editor Header -->
<div class="modal-header">
    <h5 class="modal-title">
        <i class="bi bi-grid"></i> Edit Site Plan Layout
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<!-- Siteplan Editor Body -->
<div class="modal-body p-0">
    <div id="siteplan-editor-map" class="bg-light" style="height: 600px;">
        <!-- Map will be initialized here -->
    </div>
</div>

<!-- Siteplan Editor Footer -->
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
        <i class="bi bi-x-circle"></i> Cancel
    </button>
    <button type="button" class="btn btn-primary" id="siteplan-save">
        <i class="bi bi-save"></i> Save Changes
    </button>
</div>
