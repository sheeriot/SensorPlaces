<!-- Location Header Row -->
<tr class="table-primary location-row {% if not location.is_active %}text-muted opacity-50{% endif %} {% if not location.is_active and hide_inactive %}d-none{% endif %}"
    data-location-id="{{ location.pk }}"
    data-location-active="{{ location.is_active|lower }}">
    <td class="ps-3" colspan="2">
        <a href="{% url 'sensors:location_detail' place_slug=place.slug slug=location.slug %}" class="text-decoration-none text-dark">
            <i class="bi bi-geo-alt me-2"></i>
            <strong>{{ location.name }}</strong>
        </a>
    </td>
    <td class="text-end d-none d-lg-table-cell">
        <small class="text-nowrap" title="Active (inactive) devices">
            <i class="bi bi-hdd-rack me-1"></i>{{ location.devices_active_count }} ({{ location.devices_inactive_count }})
        </small>
    </td>
    <td class="text-center">
        <small class="text-nowrap" title="Active (inactive) sensors">
            <i class="bi bi-thermometer me-1"></i>{{ location.sensors_active_count }} ({{ location.sensors_inactive_count }})
        </small>
    </td>
    <td class="d-none d-lg-table-cell"></td>
    <td></td>
</tr>
