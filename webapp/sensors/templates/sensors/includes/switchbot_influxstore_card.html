{% load static %}
<div id="switchbot-influx-card" class="card bg-light-subtle my-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-database me-2"></i>SwitchBot InfluxDB Store</h5>
        <div class="btn-group" role="group">
            <button class="btn btn-warning btn-sm"
                    hx-get="{% url 'sensors:switchbot_influx_store_edit' place_slug=place.slug %}"
                    hx-target="#htmx-modal-content"
                    data-bs-toggle="modal" 
                    data-bs-target="#htmx-modal">
                <i class="bi bi-pencil"></i> Edit
            </button>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-sm btn-secondary dropdown-toggle" 
                        data-bs-toggle="dropdown" aria-expanded="false"
                        {% if not place.switchbot_influx_store %}disabled{% endif %}>
                    <i class="bi bi-activity"></i> Test
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" href="#"
                           hx-post="{% if place.switchbot_influx_store %}{% url 'sensors:influxstore_test' place.slug place.switchbot_influx_store.pk %}?test_type=connection{% endif %}"
                           hx-target="#influx-test-results"
                           hx-swap="innerHTML">
                            <i class="bi bi-box-seam me-2"></i>Bucket Connection
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#"
                           hx-post="{% if place.switchbot_influx_store %}{% url 'sensors:influxstore_test' place.slug place.switchbot_influx_store.pk %}?test_type=write{% endif %}"
                           hx-target="#influx-test-results"
                           hx-swap="innerHTML">
                            <i class="bi bi-pencil-square me-2"></i>Write/Read Test
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="card-body">
        <p><strong>Selected Store:</strong> {{ place.switchbot_influx_store.name|default:"Not Set" }}</p>
        <div id="influx-test-results" class="mt-2">
             {% if not place.switchbot_influx_store %}
            <div class="alert alert-warning small p-2" role="alert">
                No InfluxDB store configured for SwitchBot devices. Syncing is disabled.
            </div>
            {% endif %}
        </div>
    </div>
</div>
