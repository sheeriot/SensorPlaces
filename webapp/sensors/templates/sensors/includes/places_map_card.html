<!-- Map Card -->
<div class="card map-card" {% if place_map_html %}data-places-map-folium="true"{% endif %}>
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">
                <i class="bi bi-geo-alt me-2"></i>Places Map
            </h5>
        </div>
    </div>
    <div class="card-body p-0">
        {% if place_map_html %}
            <div id="places-map">
                {{ place_map_html|safe }}
            </div>
        {% else %}
            <div class="p-3 text-center text-muted">
                <i class="bi bi-map"></i> No places to display on map
            </div>
        {% endif %}
    </div>
</div>
