<div class="card sensor-readings-table mt-4" id="graph-datapoints-{{ sensor.pk }}">
    <div class="card-header">
        <h5 class="card-title mb-0"><i class="bi bi-list-ol me-2"></i>Data Points</h5>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm mb-0">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th id="data-points-value-header-{{ sensor.pk }}">Value</th>
                    </tr>
                </thead>
                <tbody id="data-points-body-{{ sensor.pk }}">
                    <!-- Data rows will be inserted here -->
                </tbody>
            </table>
        </div>
        <div id="data-points-placeholder-{{ sensor.pk }}" class="p-4 text-center text-muted d-none">
            <i class="bi bi-graph-up fs-1"></i>
            <p class="mt-2">Select a date range and click "Graph" to view the data points here.</p>
        </div>
    </div>
</div>
