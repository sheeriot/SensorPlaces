{% load widget_tweaks %}

<div class="card rounded-3 shadow-sm border-0">
    <div class="card-header bg-white py-2">
        <h5 class="card-title mb-0">
            <i class="bi bi-geo-alt me-2"></i>Location Details
        </h5>
    </div>
    <div class="card-body py-2">
        <dl class="row mb-0">
            <dt class="col-sm-4 text-body-secondary small text-uppercase">Name</dt>
            <dd class="col-sm-8">
                <a href="{% url 'sensors:location_detail' place_slug=place.slug pk=location.pk %}">
                    {{ location.name }}
                </a>
            </dd>
            
            <dt class="col-sm-4 text-body-secondary small text-uppercase">Place</dt>
            <dd class="col-sm-8">{{ location.place.name }}</dd>

            <dt class="col-sm-4 text-body-secondary small text-uppercase">Status</dt>
            <dd class="col-sm-8">
                <span class="badge {% if location.is_active %}bg-success{% else %}bg-danger{% endif %}">
                    {% if location.is_active %}Active{% else %}inactive{% endif %}
                </span>
            </dd>
        </dl>
    </div>
</div>
