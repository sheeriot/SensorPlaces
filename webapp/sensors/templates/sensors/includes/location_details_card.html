{% load widget_tweaks %}

<div class="card rounded-3 shadow-sm border-0 mb-4 {% if not location.is_active %}opacity-75{% endif %}" id="locationCard_{{ location.pk }}">
    <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
            <i class="bi bi-geo-alt me-2"></i>
            <span class="text-body-secondary small text-uppercase me-1">Location:</span>
            <span class="fs-5">{{ location.name }}</span>
        </h5>
        <div class="btn-group">
            <a href="{% url 'sensors:location_update' place_slug=place.slug pk=location.pk %}" 
               class="btn btn-warning btn-sm">
                <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'sensors:location_delete' place_slug=place.slug pk=location.pk %}" 
               class="btn btn-danger btn-sm">
                <i class="bi bi-trash"></i>
            </a>
        </div>
    </div>
    <div class="card-body py-2">
        <dl class="row g-2 mb-0">
            <div class="row">
                <dt class="col-2 text-body-secondary small text-uppercase">Name</dt>
                <dd class="col-10 fs-5">{{ location.name }}</dd>
            </div>
            
            <div class="row">
                <dt class="col-2 text-body-secondary small text-uppercase">Place</dt>
                <dd class="col-10 fs-5">{{ location.place.name }}</dd>
            </div>

            <div class="row">
                <dt class="col-2 text-body-secondary small text-uppercase">Status</dt>
                <dd class="col-10">
                    <span class="badge {% if location.is_active %}bg-success{% else %}bg-danger{% endif %}">
                        {% if location.is_active %}Active{% else %}inactive{% endif %}
                    </span>
                </dd>
            </div>
        </dl>
    </div>
</div>
