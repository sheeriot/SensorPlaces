{% load widget_tweaks %}

<div class="card rounded-3 shadow-sm border-0 mb-4 {% if not location.is_active %}opacity-75{% endif %}" id="locationCard_{{ location.pk }}">
    <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
            <i class="bi bi-geo-alt me-2"></i>Location Details
        </h5>
        {% if model_name == 'location' %}
            <div class="btn-group">
                <a href="{% url 'sensors:location_update' place_slug=place.slug pk=location.pk %}" 
                   class="btn btn-warning btn-sm">
                    <i class="bi bi-pencil"></i>
                </a>
                <a href="{% url 'sensors:location_delete' place_slug=place.slug pk=location.pk %}" 
                   class="btn btn-danger btn-sm">
                    <i class="bi bi-trash"></i>
                </a>
            </div>
        {% else %}
            <a href="{% url 'sensors:location_detail' place_slug=place.slug pk=location.pk %}" 
               class="btn btn-outline-primary btn-sm">
                <i class="bi bi-arrow-right"></i>
            </a>
        {% endif %}
    </div>
    <div class="card-body py-2">
        <div class="d-flex flex-column gap-3">
            <div>
                <div class="text-body-secondary small text-uppercase mb-1">Name</div>
                <div class="fs-5">{{ location.name }}</div>
            </div>
            
            <div>
                <div class="text-body-secondary small text-uppercase mb-1">Place</div>
                <div class="fs-5">{{ location.place.name }}</div>
            </div>

            <div>
                <div class="text-body-secondary small text-uppercase mb-1">Status</div>
                <div>
                    <span class="badge {% if location.is_active %}bg-success{% else %}bg-danger{% endif %}">
                        {% if location.is_active %}Active{% else %}inactive{% endif %}
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
