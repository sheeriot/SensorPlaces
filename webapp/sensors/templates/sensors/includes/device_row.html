{% load static %}
<tr class="device-row {% if not device.is_active %}inactive{% endif %}" data-device-active="{{ device.is_active|lower }}" data-device-id="{{ device.pk }}">
    <td>
        <a href="{% url 'sensors:device_detail' place_slug=place.slug pk=device.pk %}" class="text-decoration-none">
            <i class="bi bi-hdd-rack me-2"></i>{{ device.name }}
        </a>
    </td>
    <td>
        <div class="form-check form-switch">
            <input class="form-check-input device-status-toggle" 
                   type="checkbox" 
                   role="switch"
                   id="deviceToggle{{ device.pk }}"
                   data-device-id="{{ device.pk }}"
                   data-location-id="{{ device.location.pk }}"
                   data-place-slug="{{ place.slug }}"
                   {% if device.is_active %}checked{% endif %}
                   {% if not device.location.is_active %}disabled{% endif %}>
            <label class="form-check-label status-label {% if device.is_active %}text-success{% else %}text-danger{% endif %}" 
                   for="deviceToggle{{ device.pk }}"
                   id="deviceStatusLabel_{{ device.pk }}">
                {% if device.is_active %}Active{% else %}inactive{% endif %}
            </label>
        </div>
    </td>
    <td>{{ device.model|default:"-" }}</td>
    <td>{{ device.manufacturer|default:"-" }}</td>
    <td>{{ device.serial_number|default:"-" }}</td>
    <td class="text-end">
        <div class="btn-group" role="group">
            <a href="{% url 'sensors:device_update' place_slug=place.slug pk=device.pk %}" 
               class="btn btn-warning btn-sm"
               {% if not device.is_active %}disabled{% endif %}>
                <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'sensors:device_delete' place_slug=place.slug pk=device.pk %}" 
               class="btn btn-danger btn-sm"
               {% if not device.is_active %}disabled{% endif %}>
                <i class="bi bi-trash"></i>
            </a>
        </div>
    </td>
</tr>
