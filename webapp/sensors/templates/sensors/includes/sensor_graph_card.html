{% load humanize %}
<div class="card my-2" id="sensor-graph-card"
     data-sensor-id="{{ sensor.pk }}"
     data-place-slug="{{ place.slug }}"
     data-sensor-name="{{ sensor.name }}"
     data-device-name="{{ sensor.device.name }}"
     data-sensor-type="{{ sensor.sensor_type.name|default:'N/A' }}"
     data-sensor-unit="{{ sensor.effective_unit.symbol|default:'' }}"
     data-graph-type="{{ sensor.effective_graph_type }}"
     data-min-value="{{ sensor.effective_min_value|default:'' }}"
     data-max-value="{{ sensor.effective_max_value|default:'' }}"
     data-decimal-places="{{ sensor.effective_decimal_places|default:2 }}"
     data-api-url="{% url 'sensors:sensor_readings_api' place_slug=place.slug pk=sensor.pk %}">

    <div class="card-header py-2">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0 fs-5 d-flex align-items-center">
                <i class="bi bi-graph-up me-2"></i>Data Graph
            </h5>
            <button class="btn btn-sm btn-primary" id="apply-date-range">Graph</button>
        </div>
        <div class="mt-2">
            {% include 'sensors/partials/_graph_controls.html' %}
        </div>
    </div>

    <div class="card-body p-2" style="min-height: 400px; position: relative;">
        <div id="graph-content-{{ sensor.pk }}" style="height: 400px;">
            <canvas id="sensorChart"></canvas>
        </div>
        <div id="graph-loading-{{ sensor.pk }}" class="d-none position-absolute top-50 start-50 translate-middle">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="graph-placeholder-{{ sensor.pk }}" class="position-absolute top-50 start-50 translate-middle text-center">
            {# Content will be injected by JS if there's no data #}
        </div>
        <div id="graph-warning-{{ sensor.pk }}" class="alert alert-warning d-none" role="alert"></div>
    </div>
    <div class="card-footer bg-light py-1 px-2 small text-muted">
        <div class="d-flex justify-content-between align-items-center">
            <span id="dp-stats-source-{{ sensor.pk }}"></span>
            <span id="dp-stats-range-{{ sensor.pk }}"></span>
            <span id="dp-stats-query-time-{{ sensor.pk }}"></span>
        </div>
    </div>
</div>
