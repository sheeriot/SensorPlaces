{% load widget_tweaks %}

<div class="card mb-1">
    <div class="card-header py-2 px-3">
        <h5 class="card-title mb-0 d-flex align-items-center">
            <i class="bi bi-house-gear me-2 text-secondary"></i>
            <span class="text-secondary fw-normal">{{ place.name }}</span>
            <div class="btn-group btn-group-sm ms-auto">
                <a href="{% url 'sensors:place_update' place.slug %}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i>
                </a>
                <a href="{% url 'sensors:place_delete' place.slug %}" class="btn btn-danger">
                    <i class="bi bi-trash"></i>
                </a>
            </div>
        </h5>
    </div>
    <div class="card-body px-2 pb-1 pt-2">
        <dl class="row g-0">
            <dt class="text-secondary small mb-1">Address</dt>
            <dd class="mb-2 fw-medium">{{ place.address }}</dd>
            
            <dt class="text-secondary small mb-1">Coordinates</dt>
            <dd class="mb-2">
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-medium">{{ place.latitude }}, {{ place.longitude }}</span>
                    <a href="https://www.google.com/maps?q={{ place.latitude }},{{ place.longitude }}" 
                       target="_blank" 
                       class="btn btn-outline-primary btn-sm rounded-circle p-1" 
                       title="Open in Google Maps">
                        <i class="bi bi-google"></i>
                    </a>
                </div>
            </dd>
            <dt class="p-0">
                <div class="border rounded folium-map-container">
                    {{ place_map_html|safe }}
                </div>
            </dt>
        </dl>
    </div>
</div>
