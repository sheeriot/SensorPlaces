<tr class="place-row {% if not place.is_active %}opacity-50 text-muted d-none{% endif %}" data-place-active="{{ place.is_active|lower }}">
    <td class="text-nowrap" style="width: 25%">
        <div class="d-flex align-items-center justify-content-between gap-2">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-house-gear"></i>
                <a href="{% url 'sensors:place_detail' place_slug=place.slug %}" class="text-decoration-none">
                    {{ place.name }}
                </a>
            </div>
            {% include "sensors/includes/status_active_badge.html" with object=place %}
        </div>
    </td>
    <td class="text-wrap text-break d-none d-md-table-cell">{{ place.address|default:"&nbsp;" }}</td>
    <td class="d-none d-lg-table-cell text-nowrap">{{ place.latitude }},{{ place.longitude }}</td>
    <td class="text-end">
        <div class="btn-group">
            <a href="{% url 'sensors:place_update' place_slug=place.slug %}" class="btn btn-sm btn-warning">
                <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'sensors:place_delete' place_slug=place.slug %}" class="btn btn-sm btn-danger">
                <i class="bi bi-trash"></i>
            </a>
        </div>
    </td>
</tr>
