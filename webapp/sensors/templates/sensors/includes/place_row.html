<tr class="place-row {% if not place.is_active %}opacity-50 text-muted d-none{% endif %}" data-place-active="{{ place.is_active|lower }}">
    <td>
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-house-gear"></i>
            <a href="{% url 'sensors:place_detail' place_slug=place.slug %}" class="text-decoration-none">
                {{ place.name }}
            </a>
        </div>
    </td>
    <td>{{ place.address }}</td>
    <td>{{ place.latitude }}, {{ place.longitude }}</td>
    <td>
        <div class="d-flex align-items-center gap-2">
            <span class="badge rounded-pill {% if place.is_active %}bg-success{% else %}bg-danger{% endif %}">
                {% if place.is_active %}Active{% else %}Inactive{% endif %}
            </span>
        </div>
    </td>
    <td>
        <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#placeMapModal" data-place-lat="{{ place.latitude }}" data-place-lon="{{ place.longitude }}" data-place-name="{{ place.name }}">
                <i class="bi bi-map"></i>
            </button>
            <a href="{% url 'sensors:place_update' place_slug=place.slug %}" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'sensors:place_delete' place_slug=place.slug %}" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash"></i>
            </a>
        </div>
    </td>
</tr>
