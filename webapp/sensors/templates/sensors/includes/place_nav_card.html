{% load widget_tweaks %}

<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <span>
                <i class="bi bi-geo-alt"></i>
                Locations
            </span>
            <div class="form-check form-switch d-flex align-items-center gap-2 mb-0">
                <input class="form-check-input" type="checkbox" id="hideInactiveLocations" checked>
                <label class="form-check-label small-label" for="hideInactiveLocations">
                    Hide<br>inactive
                </label>
            </div>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="list-group list-group-flush rounded-bottom">
            {% for location in locations %}
            <a href="{% url 'sensors:location_detail' place_slug=place.slug pk=location.pk %}" 
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-1 px-2
                      {% if location.pk == current_location.pk %}active-location{% endif %}"
               data-active="{{ location.is_active|lower }}"
               data-location-id="{{ location.pk }}">
                <div>
                    {{ location.name }}
                    {% if not location.is_active %}
                    <span class="badge bg-danger ms-2">inactive</span>
                    {% endif %}
                </div>
                <div class="d-flex align-items-center">
                    <span class="device-counts me-2">
                        <span class="text-success font-monospace fw-bold active-count" id="location-{{ location.pk }}-active">{{ location.active_devices_count }}</span>
                        (<span class="text-body-secondary font-monospace" id="location-{{ location.pk }}-inactive">{{ location.inactive_devices_count|default:0 }}</span>)
                    </span>
                    <i class="bi bi-hdd-rack"></i>
                </div>
            </a>
            {% empty %}
            <div class="list-group-item text-center text-muted py-2">
                <i class="bi bi-inbox"></i>
                <p class="mb-0 mt-2">No locations found</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
