<div class="card my-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-database me-2"></i>InfluxDB Details</span>
        <div class="btn-group">
            <button class="btn btn-sm btn-warning"
                    hx-get="{% url 'sensors:sensor_influx_update' place_slug=place.slug pk=sensor.pk %}"
                    hx-target="#htmx-modal-content"
                    data-bs-toggle="modal"
                    data-bs-target="#htmx-modal">
                <i class="bi bi-pencil"></i> Edit
            </button>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-sm btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-activity"></i> Test
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" href="#"
                           hx-post="{% url 'sensors:influxstore_test' place.slug sensor.influx_store.pk %}?test_type=bucket_read"
                           hx-target="#influx-test-results-{{ sensor.pk }}"
                           hx-swap="innerHTML">
                           <i class="bi bi-box-seam me-2"></i>Bucket Read Test
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#"
                           hx-post="{% url 'sensors:influxstore_test' place.slug sensor.influx_store.pk %}?test_type=sensor_read&sensor_pk={{ sensor.pk }}"
                           hx-target="#influx-test-results-{{ sensor.pk }}"
                           hx-swap="innerHTML">
                           <i class="bi bi-graph-up me-2"></i>Read Sensor Data
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item" href="#"
                           hx-post="{% url 'sensors:influxstore_test' place.slug sensor.influx_store.pk %}?test_type=write"
                           hx-target="#influx-test-results-{{ sensor.pk }}"
                           hx-swap="innerHTML">
                           <i class="bi bi-pencil-square me-2"></i>Write/Read Perms
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div id="sensor-influx-details-{{ sensor.pk }}" class="card-body" hx-trigger="refresh-sensor-card-{{ sensor.pk }} from:body" hx-get="{% url 'sensors:sensor_detail_card' place_slug=place.slug pk=sensor.pk %}?card=influx" hx-target="this">
        {% include 'sensors/partials/_sensor_influx_card_body.html' %}
    </div>
</div>
