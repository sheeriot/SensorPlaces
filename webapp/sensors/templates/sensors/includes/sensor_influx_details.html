<div class="card my-2" id="sensor-influx-card-{{ sensor.pk }}">
    <div class="card-header">
        <h5 class="card-title mb-0 d-flex align-items-center">
            <i class="bi bi-database me-2"></i> InfluxDB Integration
        </h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-2">
                    <label class="form-label mb-0 small text-muted">Source</label>
                    <div>{{ sensor.influx_source.name|default:"N/A" }}</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-2">
                    <label class="form-label mb-0 small text-muted">Measurement</label>
                    <div><code class="user-select-all">{{ sensor.influx_measurement|default:"N/A" }}</code></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="mb-2">
                    <label class="form-label mb-0 small text-muted">Field</label>
                    <div><code class="user-select-all">{{ sensor.influx_field_name|default:"N/A" }}</code></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-2">
                    <label class="form-label mb-0 small text-muted">Tag Key</label>
                    <div><code class="user-select-all">{{ sensor.influx_tag_key|default:"N/A" }}</code></div>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <button class="btn btn-sm btn-outline-info"
                    hx-get="{% url 'sensors:test_influx_connection' place_slug=place.slug pk=sensor.pk %}"
                    hx-target="#influx-test-results-{{ sensor.pk }}"
                    hx-swap="innerHTML">
                <span class="spinner-border spinner-border-sm htmx-indicator" role="status" aria-hidden="true"></span>
                <i class="bi bi-speedometer2 me-1"></i>
                Test Connection & Stats
            </button>
        </div>
        <div id="influx-test-results-{{ sensor.pk }}" class="mt-2 small">
            <!-- Test results will be loaded here -->
        </div>
    </div>
</div>
