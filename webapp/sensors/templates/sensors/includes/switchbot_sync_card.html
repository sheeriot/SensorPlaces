<div id="device-sync-card" class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
            <i class="bi bi-robot me-2"></i>Device Sync
        </h5>
        <div>
            <button class="btn btn-primary btn-lg"
                    hx-get="{% url 'sensors:switchbot_api_sync' place.slug %}"
                    hx-target="#sync-results"
                    hx-target-error="#sync-results"
                    hx-indicator="#sync-spinner">
                <i class="bi bi-robot me-1"></i>
                Fetch from SwitchBot API
            </button>
            <span id="sync-spinner" class="htmx-indicator spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span>
        </div>
    </div>
    <div class="card-body">
        <p>Click the button above to fetch a fresh list of devices from your SwitchBot account. You can then import new devices or inspect them.</p>
        <div id="sync-results"
             class="mt-3"
             hx-get="{% url 'sensors:switchbot_api_sync' place.slug %}"
             hx-trigger="refreshSyncList from:body"
             hx-target="this"
             hx-swap="innerHTML">
            {# This div will be populated by the HTMX request #}
        </div>
    </div>
</div>
