<!-- Site Plan Editor Modal Content -->
<div class="modal-header">
    <h5 class="modal-title">Edit Site Plan Layout</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body p-0 d-flex flex-column" style="min-height: 70vh">
    <!-- Controls Toolbar -->
    <div class="btn-toolbar bg-white border-bottom p-3" role="toolbar">
        <div class="btn-group me-2" role="group">
            <button id="site-plan-editor-reset" class="btn btn-outline-secondary" title="Reset View">
                <i class="bi bi-arrow-counterclockwise"></i>
                <span class="d-none d-md-inline ms-1">Reset View</span>
            </button>
        </div>
    </div>

    <!-- Site plan editor area -->
    <div class="position-relative flex-grow-1 bg-light border" style="min-height: 400px">
        <div id="site-plan-editor-map" 
             class="position-absolute top-0 start-0 w-100 h-100"
             data-editor="true"
             data-editor-ready="false">
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="button" class="btn btn-primary" id="site-plan-editor-save">Save Changes</button>
</div>
