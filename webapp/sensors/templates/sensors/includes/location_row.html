{% comment %}
This template expects:
- location: Location object with active_devices_count and inactive_devices_count annotations
- place: Place object
{% endcomment %}
<tr class="location-row {% if not location.is_active %}opacity-50 text-muted d-none{% endif %}" 
    data-location-active="{{ location.is_active|lower }}" 
    data-location-id="{{ location.pk }}">
    <td>
        <a href="{% url 'sensors:location_detail' place_slug=place.slug pk=location.pk %}" 
           class="btn btn-outline-info text-dark m-0 p-1 small d-flex align-items-center">
            <i class="bi bi-geo-alt me-1"></i>
            <span class="d-inline-block text-truncate" style="max-width: 150px;">{{ location.name }}</span>
        </a>
    </td>
    <td>
        <div class="form-check form-switch">
            <input class="form-check-input location-status-toggle" 
                   type="checkbox" 
                   role="switch"
                   id="toggle-location-active-{{ location.pk }}"
                   data-location-id="{{ location.pk }}"
                   data-place-slug="{{ place.slug }}"
                   {% if location.is_active %}checked{% endif %}>
            <label class="form-check-label status-label {% if location.is_active %}text-success{% else %}text-danger{% endif %}" 
                   for="toggle-location-active-{{ location.pk }}"
                   id="locationStatusLabel_{{ location.pk }}">
                {% if location.is_active %}Active{% else %}inactive{% endif %}
            </label>
        </div>
    </td>
    <td>
        <span class="text-success">{{ location.active_devices_count }}</span>
        <span class="text-secondary">({{ location.inactive_devices_count }})</span>
    </td>
    <td>
        <div class="btn-group btn-group-sm">
            <a href="{% url 'sensors:location_update' place_slug=place.slug pk=location.pk %}" 
               class="btn btn-warning">
                <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'sensors:location_delete' place_slug=place.slug pk=location.pk %}" 
               class="btn btn-danger">
                <i class="bi bi-trash"></i>
            </a>
        </div>
    </td>
</tr>
