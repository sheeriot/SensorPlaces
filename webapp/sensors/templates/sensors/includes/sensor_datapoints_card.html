<div id="graph-datapoints-container-{{ sensor.pk }}" class="d-none">
    <div class="card my-2" id="graph-datapoints-{{ sensor.pk }}">
        <div class="card-header py-2"
             id="heading-datapoints-{{ sensor.pk }}"
             style="cursor: pointer;">
            <div class="d-flex justify-content-between align-items-center w-100">
                <h5 class="card-title mb-0 fs-5 d-flex align-items-center">
                    <i class="bi bi-table me-2"></i>Data Points
                    <small class="text-muted ms-2 fw-normal" style="font-size: 0.7em;">
                        <i class="bi bi-info-circle"></i> Click a row to zoom
                    </small>
                </h5>
                <div class="d-flex align-items-center small text-muted">
                    <span id="dp-stats-count-{{ sensor.pk }}" class="me-2"></span>
                    <i class="bi bi-chevron-down ms-2"></i>
                </div>
            </div>
            <hr class="my-1">
            <div class="d-flex justify-content-between align-items-center small text-muted w-100">
                <span id="dp-stats-first-{{ sensor.pk }}"></span>
                <span id="dp-stats-last-{{ sensor.pk }}"></span>
            </div>
            <!-- Data point navigation controls will be inserted here by JS -->
        </div>
        <div id="collapse-datapoints-{{ sensor.pk }}" class="collapse show" aria-labelledby="heading-datapoints-{{ sensor.pk }}">
            <div class="card-body p-2">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover font-monospace">
                        <thead>
                            <tr>
                                <th><i class="bi bi-clock-history me-1"></i>Timestamp</th>
                                <th id="data-points-value-header-{{ sensor.pk }}">Value</th>
                            </tr>
                        </thead>
                        <tbody id="data-points-body-{{ sensor.pk }}">
                            {# Rows will be dynamically inserted here by sensor-chart.js #}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
