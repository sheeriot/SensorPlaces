<!-- Data points card, hidden by default -->
<div class="card my-2 d-none" id="graph-datapoints-{{ sensor.pk }}">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">Data Points</h5>
        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDataPoints-{{ sensor.pk }}" aria-expanded="false" aria-controls="collapseDataPoints-{{ sensor.pk }}">
            <i class="bi bi-chevron-down"></i>
        </button>
    </div>
    <div class="collapse" id="collapseDataPoints-{{ sensor.pk }}">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover mb-0">
                    <thead class="table-light sticky-top">
                        <tr>
                            <th>Timestamp</th>
                            <th class="text-end" id="data-points-value-header-{{ sensor.pk }}">
                                Value ({{ sensor.effective_unit.symbol|default:'' }})
                            </th>
                        </tr>
                    </thead>
                    <tbody id="data-points-body-{{ sensor.pk }}">
                        <!-- Rows will be inserted by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
