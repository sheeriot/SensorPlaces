<!-- Site Plan/Map Card -->
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">Site Plan</h5>
        <button id="editSitePlan" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-grid"></i> Edit Layout
        </button>
    </div>
    <div class="card-body p-0">
        <div class="site-plan-wrapper">
            <div id="siteMapContainer" 
                 data-scale="{{ place.site_plan_scale }}"
                 data-x="{{ place.site_plan_x }}"
                 data-y="{{ place.site_plan_y }}">
                <!-- Move markers outside of the scaled content -->
            {% for location in locations %}
                <div class="location-marker position-absolute p-1 {% if not location.is_active %}opacity-50 bg-secondary{% else %}bg-primary{% endif %}" 
                     data-location-id="{{ location.pk }}"
                     data-active="{{ location.is_active|lower }}"
                     data-x="{{ location.x_coord|default:50 }}"
                     data-y="{{ location.y_coord|default:50 }}"
                     style="left: {{ location.x_coord|default:50 }}%; top: {{ location.y_coord|default:50 }}%;">
                    <div class="marker-content p-0 m-0">
                        <div class="location-name p-0 m-0">{{ location.name }}</div>
                        <div class="device-count p-0 m-0">{{ location.active_devices_count }}</div>
                    </div>
                </div>
            {% endfor %}
                <!-- Background site plan that gets scaled -->
                <div class="site-plan-background" style="background-image: url('{{ place.site_plan.url }}');"></div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="sitePlanModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Site Plan Layout</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <!-- Controls Panel -->
                <div id="editControls" class="p-2 border-bottom">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group btn-group-sm">
                            <button id="zoomIn" class="btn btn-outline-secondary">
                                <i class="bi bi-zoom-in"></i>
                            </button>
                            <button id="zoomOut" class="btn btn-outline-secondary">
                                <i class="bi bi-zoom-out"></i>
                            </button>
                        </div>
                        <div class="btn-group btn-group-sm">
                            <button id="moveLeft" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i>
                            </button>
                            <button id="moveUp" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-up"></i>
                            </button>
                            <button id="moveDown" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-down"></i>
                            </button>
                            <button id="moveRight" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                        <div class="btn-group btn-group-sm">
                            <button id="resetView" class="btn btn-outline-secondary">
                                <i class="bi bi-arrows-fullscreen"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- Site Plan Editor -->
                <div class="site-plan-editor">
                    <div id="siteMapEditorContainer" class="position-relative">
                        <!-- Markers and background will be cloned here -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="savePositions">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('siteMapContainer');
    const editButton = document.getElementById('editSitePlan');
    const saveButton = document.getElementById('savePositions');
    const modal = new bootstrap.Modal(document.getElementById('sitePlanModal'));
    const editorContainer = document.getElementById('siteMapEditorContainer');
    
    // Initialize layout from saved settings
    let scale = parseFloat(container.dataset.scale) || 1.0;
    let x = parseFloat(container.dataset.x) || 0;
    let y = parseFloat(container.dataset.y) || 0;
    
    function updateTransform(target) {
        // Constrain scale
        scale = Math.max(0.5, Math.min(3.0, scale));
        
        // Only transform the background
        const background = target.querySelector('.site-plan-background');
        background.style.transform = `scale(${scale}) translate(${x}px, ${y}px)`;
    }
    
    // Initial transform
    updateTransform(container);

    // Open editor
    editButton.addEventListener('click', function() {
        // Clone the site map content
        editorContainer.innerHTML = container.innerHTML;
        updateTransform(editorContainer);
        
        // Initialize draggable markers
        const markers = editorContainer.querySelectorAll('.location-marker');
        markers.forEach(initializeDraggable);
        
        modal.show();
    });

    // Zoom controls
    document.getElementById('zoomIn')?.addEventListener('click', () => {
        scale = Math.min(scale * 1.2, 3.0);
        updateTransform(editorContainer);
    });

    document.getElementById('zoomOut')?.addEventListener('click', () => {
        scale = Math.max(scale / 1.2, 0.5);
        updateTransform(editorContainer);
    });

    // Movement controls
    const MOVE_STEP = 20;
    document.getElementById('moveLeft')?.addEventListener('click', () => {
        x -= MOVE_STEP / scale;
        updateTransform(editorContainer);
    });
    document.getElementById('moveRight')?.addEventListener('click', () => {
        x += MOVE_STEP / scale;
        updateTransform(editorContainer);
    });
    document.getElementById('moveUp')?.addEventListener('click', () => {
        y -= MOVE_STEP / scale;
        updateTransform(editorContainer);
    });
    document.getElementById('moveDown')?.addEventListener('click', () => {
        y += MOVE_STEP / scale;
        updateTransform(editorContainer);
    });

    // Reset view
    document.getElementById('resetView')?.addEventListener('click', () => {
        scale = 1.0;
        x = 0;
        y = 0;
        updateTransform(editorContainer);
    });

    function initializeDraggable(marker) {
        let isDragging = false;
        let startX, startY;
        let originalX, originalY;
        
        marker.addEventListener('mousedown', function(e) {
            isDragging = true;
            marker.classList.add('dragging');
            
            startX = e.clientX;
            startY = e.clientY;
            originalX = parseFloat(marker.dataset.x);
            originalY = parseFloat(marker.dataset.y);
            
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            const containerRect = editorContainer.getBoundingClientRect();
            const deltaXPercent = (dx / containerRect.width) * 100;
            const deltaYPercent = (dy / containerRect.height) * 100;
            
            const newX = Math.max(0, Math.min(100, originalX + deltaXPercent));
            const newY = Math.max(0, Math.min(100, originalY + deltaYPercent));
            
            marker.dataset.x = newX.toFixed(2);
            marker.dataset.y = newY.toFixed(2);
            marker.style.left = `${newX}%`;
            marker.style.top = `${newY}%`;
        });
        
        document.addEventListener('mouseup', function() {
            if (!isDragging) return;
            isDragging = false;
            marker.classList.remove('dragging');
        });
    }

    // Save positions and layout
    saveButton?.addEventListener('click', async function() {
        const markers = editorContainer.querySelectorAll('.location-marker');
        const promises = Array.from(markers).map(marker => {
            const locationId = marker.dataset.locationId;
            const x = marker.dataset.x;
            const y = marker.dataset.y;

            return fetch(`/api/{{ place.slug }}/locations/${locationId}/position/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}',
                },
                body: JSON.stringify({ x_coord: x, y_coord: y })
            });
        });

        try {
            await Promise.all(promises);
            
            // Save layout settings
            await fetch(`{% url 'sensors:update_site_plan_layout' place_slug=place.slug %}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}',
                },
                body: JSON.stringify({
                    site_plan_scale: scale,
                    site_plan_x: x,
                    site_plan_y: y
                })
            });
            
            // Update the main container
            container.innerHTML = editorContainer.innerHTML;
            updateTransform(container);
            
            modal.hide();
            showToast('Layout saved successfully!', 'success');
        } catch (error) {
            showToast('Error saving layout', 'danger');
            console.error('Error:', error);
        }
    });
});
</script>
