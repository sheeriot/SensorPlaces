<div id="unassigned-device-list-card" class="card my-1">
    <div class="card-header d-flex justify-content-between align-items-center py-1">
        <div class="d-flex align-items-center gap-3">
            <h5 class="card-title mb-0 fs-5 d-flex align-items-center">
                <i class="bi bi-question-circle me-1"></i> 
                Unassigned Devices
            </h5>
        </div>
    </div>
    <div class="card-body toggle-table p-0" id="unassigned-device-card-table">
        <div class="table-responsive">
            <table class="table table-light table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width: 25%">Name</th>
                        <th style="width: 15%">Status</th>
                        <th style="width: 15%">Type</th>
                        <th style="width: 15%">Model</th>
                        <th style="width: 15%">Manufacturer</th>
                        <th style="width: 15%">Device ID</th>
                        <th style="width: 10%" class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for device in unassigned_devices %}
                        {% include "sensors/includes/device_row.html" with place=place device=device %}
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
