<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
            <i class="bi bi-hdd-rack me-2"></i>Device Info
        </h5>
        <a href="{% url 'sensors:device_update' place_slug=place.slug pk=device.pk %}" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-pencil-fill"></i> Edit
        </a>
    </div>
    <div class="card-body">
        <h6 class="card-subtitle mb-2 text-muted">{{ device.name }}</h6>
        <p class="card-text">
            <strong>Model:</strong> {{ device.model|default:"N/A" }}<br>
            <strong>Manufacturer:</strong> {{ device.manufacturer|default:"N/A" }}<br>
            <strong>Device ID:</strong> {{ device.device_id|default:"N/A" }}
        </p>
        <p class="card-text">
            <small class="text-muted">Location: {{ device.location.name }}</small>
        </p>
    </div>
</div>
