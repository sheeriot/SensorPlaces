<div class="card my-1">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
            <i class="bi bi-database me-2"></i>InfluxDB Stores
        </h5>
        <a href="{% url 'sensors:influxstore_create' place_slug=place.slug %}" class="btn btn-sm btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Add New
        </a>
    </div>
    <div class="list-group list-group-flush" id="influx-store-list">
        <!-- Header -->
        <div class="list-group-item bg-light d-none d-md-block">
            <div class="row align-items-center">
                <div class="col-md-3"><strong>Name</strong></div>
                <div class="col-md-3"><strong>Organization</strong></div>
                <div class="col-md-3"><strong>Bucket</strong></div>
                <div class="col-md-3 text-end"><strong>Actions</strong></div>
            </div>
        </div>
        <!-- Data Rows -->
        {% for store in influxstores %}
            {% include "sensors/partials/influxstore_row.html" %}
        {% empty %}
        <div class="list-group-item text-center text-muted">
            No InfluxDB stores found.
        </div>
        {% endfor %}
    </div>
</div>
