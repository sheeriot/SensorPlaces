{% load crispy_forms_tags %}
<div class="card rounded-3 shadow-sm border-0" id="sensor-form-card">
    <div class="card-header bg-white py-2">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">
                <i class="bi bi-hdd-rack"></i>
                {% if object %}Edit Sensor: {{ sensor.name }}{% else %}New Sensor{% endif %}
                <i class="bi bi-chevron-right"></i>
                <a href="{% url 'sensors:device_detail' place_slug=place.slug pk=device.pk %}">
                    <i class="bi bi-hdd-rack"></i>
                    {{ device.name }}
                </a> 
                <i class="bi bi-chevron-right"></i>
        <a href="{% url 'sensors:location_detail' place_slug=place.slug pk=device.location.pk %}">
            <i class="bi bi-geo-alt-fill"></i>
            {{ location.name }}
        </a> 
        <i class="bi bi-chevron-right"></i>
        <a href="{% url 'sensors:place_detail' place.slug %}">
                    <i class="bi bi-house-gear"></i>
                    {{ place.name }}
                </a> 
            </h5>
        </div>
    </div>
    <div class="card-body">
        {% crispy form %}
    </div>
</div>
