{% extends 'sensors/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Sensor Types</h2>
        <a href="{% url 'sensors:sensortype_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Create New Sensor Type
        </a>
    </div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for sensortype in object_list %}
            <tr>
                <td><a href="{{ sensortype.get_absolute_url }}">{{ sensortype.name }}</a></td>
                <td>{{ sensortype.description|truncatewords:20 }}</td>
                <td>
                    <a href="{% url 'sensors:sensortype_update' pk=sensortype.pk %}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">No sensor types found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
