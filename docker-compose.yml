# Base docker-compose file. Use docker-compose.override.yml files as needed.

services:
  sensors:
    build:
      context: .
    env_file:
      - env/django.env
    # environment:
    #   - STATIC_BUSTER=True
    entrypoint: /opt/app/docker-entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8010
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8010}:${WEB_PORT:-8010}"
    volumes:
      - sensors-db:/opt/app/db
      - sensors-static:/opt/app/static_files
      - sensors-media:/opt/app/media
      - ./webapp:/opt/app/webapp

  test:
    build:
      context: .
    env_file:
      - env/django-test.env
      - env/influx-test.env
    entrypoint: /opt/app/docker-entrypoint.sh
    # This service is for running tests. It has no volumes and is fully isolated.
    # Arguments passed to 'docker compose run' are appended to the 'python manage.py test' command.
    command: python manage.py test
    profiles:
      - test
    volumes:
      - ./webapp:/opt/app/webapp

volumes:
  sensors-db:
  sensors-static:
  sensors-media:

networks:
  default:
    name: webhost
    external: true
